[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "callguard-ai"
version = "0.1.0"
description = "Production-style release validation gate for Voice AI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "streamlit>=1.28",
    "jinja2>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
callguard = "callguard_ai.__main__:main"
